<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlowAI</title>
<style>
body{margin:0;background:#111;color:#eee;font-family:Arial,sans-serif;width:380px}main{padding:18px}h2{margin:0 0 16px}.card{background:#222;border-radius:10px;padding:12px;margin-bottom:14px}label{display:block;margin-bottom:6px;font-weight:700}select,button{width:100%;box-sizing:border-box;padding:11px;border-radius:7px;border:0;font-size:14px}select{background:#292929;color:#fff;border:1px solid #666}button{margin-top:9px;cursor:pointer;background:#444;color:#fff}button:disabled{opacity:.45;cursor:not-allowed}.status{font-size:12px;min-height:35px;line-height:1.4}.details{font-size:12px;background:#1d1d1d;border:1px solid #444;border-radius:8px;padding:10px;margin-top:14px;max-height:160px;overflow:auto}
</style>
</head>
<body>
<main>
<h2>🚀 FlowAI</h2>
<div class="card"><b>Current AI</b><div id="provider" style="margin-top:5px">Detecting...</div></div>
<label for="destination">Transfer to</label>
<select id="destination"><option value="chatgpt">ChatGPT</option><option value="claude">Claude</option><option value="gemini">Gemini</option></select>
<div class="status"><b>Status:</b> <span id="status">Ready</span></div>
<button id="export">📤 Export Conversation</button>
<button id="transfer" disabled>🚀 Transfer Conversation</button>
<button id="download" disabled>💾 Download JSON</button>
<div id="details" class="details" hidden></div>
</main>
<script src="popup.js"></script>
</body>
</html>
