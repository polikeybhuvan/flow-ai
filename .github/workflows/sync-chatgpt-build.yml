name: Sync ChatGPT fix build

on:
  push:
    branches: ["fix/chatgpt-current-dom"]
    paths:
      - "source/**"
      - ".github/workflows/sync-chatgpt-build.yml"

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/chatgpt-current-dom
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint, test, and build
        working-directory: source
        run: |
          npm run lint
          npm test
          npm run build
      - name: Commit generated extension assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "Generated extension assets are already current."
          else
            git commit -m "chore: sync generated extension build"
            git push origin HEAD:fix/chatgpt-current-dom
          fi
