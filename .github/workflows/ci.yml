name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "source/**"
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "source/**"
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint and build extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
