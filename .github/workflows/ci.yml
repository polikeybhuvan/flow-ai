name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "source/**"
      - "dist/**"
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "source/**"
      - "dist/**"
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  lint-test-build:
    name: Lint, test, and build extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: TypeScript check and production build
        run: npm run build
      - name: Upload built extension
        uses: actions/upload-artifact@v4
        with:
          name: flowai-extension-${{ github.sha }}
          path: dist/**
          if-no-files-found: error
          retention-days: 7

      - name: Ensure generated assets are committed
        working-directory: ${{ github.workspace }}
        run: |
          if [ -n "$(git status --short --untracked-files=all)" ]; then
            git status --short --untracked-files=all
            echo "::error::Generated output or tracked files are out of sync. Run npm ci, npm test, and npm run build in source, then commit the resulting dist/ output."
            exit 1
          fi
