name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "source/**"
      - "dist/**"
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "source/**"
      - "dist/**"
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  lint-test-build:
    name: Lint, test, and build extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate initial lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit generated extension and lockfile
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/package-lock.json dist/
          if git diff --cached --quiet; then
            echo "Generated artifacts are already up to date."
          else
            git commit -m "Sync lockfile and built extension"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload bootstrap build and lockfile
        uses: actions/upload-artifact@v4
        with:
          name: flowai-bootstrap-files
          path: |
            source/package-lock.json
            dist/**
          if-no-files-found: error
          retention-days: 7
